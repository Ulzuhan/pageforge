name: Publish container images

# Two images from one repository: ghcr.io/ulzuhan/pageforge and ghcr.io/ulzuhan/inkbar.
#
#   push to main         both images, :main and :sha-<short>   (not released yet)
#   tag pageforge-vX.Y.Z PageForge only: :X.Y.Z, :X.Y, :X, :latest
#   tag inkbar-vX.Y.Z    InkBar only, same ladder
#
# Only the release build mints :latest, and it is the same build that mints the
# version ladder, so they are the same digest by construction (the lesson from
# the house services, where two runs raced and left :latest on another digest).
on:
  push:
    branches: [main]
    tags: ["pageforge-v*", "inkbar-v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.which.outputs.tools }}
    steps:
      - id: which
        run: |
          case "$GITHUB_REF" in
            refs/tags/pageforge-v*) echo 'tools=["pageforge"]' >> "$GITHUB_OUTPUT" ;;
            refs/tags/inkbar-v*)    echo 'tools=["inkbar"]' >> "$GITHUB_OUTPUT" ;;
            *)                      echo 'tools=["pageforge","inkbar"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
    permissions:
      contents: read
      packages: write
      # Signing by OIDC against Sigstore, and storing the signed attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.tool }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.tool }}
          tags: |
            type=match,pattern=${{ matrix.tool }}-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=${{ matrix.tool }}-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=${{ matrix.tool }}-v(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, format('refs/tags/{0}-v', matrix.tool)) }}
            type=ref,event=branch
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: TOOL=${{ matrix.tool }}
          platforms: linux/amd64
          push: true
          # BuildKit's provenance and SBOM are unsigned in-toto statements: they
          # cover integrity, not origin. The signature is the attestation below.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tool }}

      # THE SIGNATURE: keyless, with this run's OIDC identity against Sigstore.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The gate: what was just signed is verified here, bound to this repository,
      # this workflow file, this commit and this ref. A red release is not deployed.
      - name: Verify the signature of what was just published
        run: |
          gh attestation verify "oci://${REGISTRY}/${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/docker.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}"
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # And the CVE gate: highs and criticals with a fix available turn the run red.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
        env:
          TRIVY_TIMEOUT: 20m
